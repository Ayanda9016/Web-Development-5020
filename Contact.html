<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - Alluring Florals</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="Home.html" class="logo">ALLURING FLORALS 🌸</a>
  <ul>
    <li><a href="Home.html">Home</a></li>
    <li><a href="About.html">About</a></li>
    <li><a href="Shop.html">Shop</a></li>
    <li><a href="enquiry.html">Enquiry</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>
</html>
</body>

<div class="contact-wrapper">
  <div class="contact-info">
    <h1>Contact Us</h1>
    <p>General enquiries - we reply in 2 hours</p>
    <p> 45 Flower Street, Durban Central, 4001 </p>
    <p>031 123 4567</p>
    <p>hello@alluringflorals.co.za</p>
  </div>

  <form id="contactForm" novalidate>
  <div class="form-group">
    <label>Your Name *</label>
    <input type="text" id="conName" name="conName" placeholder="Full Name" required minlength="3">
    <small class="error" id="conNameError"></small>
  </div>

  <div class="form-group">
    <label>Email *</label>
    <input type="email" id="conEmail" name="conEmail" placeholder="you@example.com" required>
    <small class="error" id="conEmailError"></small>
  </div>

  <div class="form-group">
    <label>Phone*</label>
    <input type="tel" id="conPhone" name="conPhone" placeholder="0821234567 (optional)" pattern="[0-9]{10}">
    <small class="error" id="conPhoneError"></small>
  </div>

  <div class="form-group">
    <label>Type of Message *</label>
    <select id="conType" name="conType" required>
      <option value="">---- Select Type ----</option>
      <option value="general">General Enquiry</option>
      <option value="complaint">Complaint</option>
      <option value="feedback">Feedback</option>
      <option value="support">Customer Support</option>
    </select>
    <small class="error" id="conTypeError"></small>
  </div>

  <div class="form-group">
    <label>Full Message *</label>
    <textarea id="conMessage" name="conMessage" rows="4" placeholder="Type your full message here... min 20 chars" required minlength="20"></textarea>
    <small class="error" id="conMessageError"></small>
  </div>

  <button type="submit" class="btn btn-full">Send Email</button>
  <div id="conStatus" class="form-status hidden"></div>

  <div id="emailPreview" class="email-preview hidden">
    <h6>Email to be sent:</h6>
    <pre id="emailContent"></pre>
    <div>
      <a id="mailtoLink" href="#" class="btn btn-full" style="background:#f15036">Open in Email App</a>
    </div>
  </div>
</form>
<script src="JS/script.js"></script>
</body>
</html>
